[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-agent"
version = "2.0.0"
description = "A news agent that clusters the same story across outlets, ranks what matters, and delivers one clean digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sxnmit" }]
keywords = ["news", "digest", "rss", "llm", "agent", "newsletter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "feedparser>=6.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/sxnmit/signal"
Source = "https://github.com/sxnmit/signal"
Issues = "https://github.com/sxnmit/signal/issues"

[project.scripts]
signal = "signal_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["signal_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must mirror the signatures they stand in for, so unused
# arguments are the point rather than an oversight.
"tests/*" = ["ARG", "RUF012"]
# Inline-styled email HTML and the embedded stylesheet cannot be wrapped
# without changing the output these modules exist to produce.
"src/signal_agent/render/email.py" = ["E501"]
"src/signal_agent/render/site.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["signal_agent"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
