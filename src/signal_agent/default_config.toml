# ==========================================================================
#  Signal — default configuration
#
#  `signal init` copies this file into your project so you can edit it.
#  Anything you leave out falls back to the values here, so a user config can
#  be as short as a single [email] block.
#
#  Secrets never belong in this file. Put them in .env (see .env.example);
#  every key below can also be overridden by an environment variable.
# ==========================================================================

title = "Signal"
tagline = "The stories that mattered today, and who else ran them."

[fetch]
# Only consider articles published within this window.
window_hours = 36
# Per-request HTTP timeout, in seconds.
timeout_seconds = 12
# Feeds are fetched concurrently; this caps the worker pool.
max_workers = 12
user_agent = "signal/2.0 (+https://github.com/sxnmit/signal)"

[dedup]
# Articles whose titles overlap by at least this much are treated as the same
# story. Raise it if unrelated stories are being merged; lower it if obvious
# duplicates slip through. 0.0-1.0.
similarity_threshold = 0.35
# Remember articles for this many days so a story is never sent twice; older
# rows are pruned on each run to keep the database small.
retention_days = 90

[rank]
# Half-life of the recency bonus, in hours.
recency_half_life_hours = 18.0
# How much a story gains from being covered by several independent outlets.
corroboration_weight = 0.55
# Drop anything scoring below this before it reaches the summarizer.
min_score = 0.15
# Hard cap on stories per topic, before each topic's own max_stories applies.
max_stories_per_topic = 5
# Never spend summarizer calls on more than this many clusters per run.
max_clusters_per_run = 60

[summarize]
# "extractive" needs no API key and no network. "llm" calls a chat-completions
# endpoint; "auto" uses the LLM when a key is present and quietly falls back.
provider = "auto"
# Any OpenAI-compatible endpoint works: Groq, OpenAI, Together, OpenRouter,
# a local Ollama, vLLM... Anthropic's API is supported natively too.
api = "openai"           # "openai" | "anthropic"
base_url = "https://api.groq.com/openai/v1"
model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"
max_tokens = 2000
temperature = 0.2
# Summarize this many topics per batch request.
timeout_seconds = 60
retries = 2

[store]
path = "news_digest.db"

[archive]
# One JSON file per edition. Small, diffable, and the input to the static site.
enabled = true
directory = "archive"

[site]
# `signal site` renders the archive into a static, searchable website.
enabled = true
directory = "site"
base_url = ""

[email]
enabled = true
smtp_host = "smtp.gmail.com"
smtp_port = 587
sender = ""
password = ""
recipients = []
# Send one message per recipient so addresses are never disclosed to each other.
private_recipients = true
subject_template = "{icon} {title} — {date}"

[webhook]
# Post the digest to Slack, Discord, or anything that accepts a JSON payload.
enabled = false
url = ""
format = "slack"         # "slack" | "discord" | "json"

[newsapi]
enabled = true
api_key_env = "NEWS_API_KEY"
language = "en"
max_articles = 5
page_size = 20

[hackernews]
# Front-page stories above a points threshold. No API key required.
enabled = true
min_points = 120
max_articles = 25

