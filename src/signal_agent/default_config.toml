name = "Artificial Intelligence"
slug = "ai"
icon = "🧠"
query = "artificial intelligence OR LLM OR \"machine learning\""
max_stories = 5
keywords = [
  "ai", "artificial intelligence", "llm", "large language model", "machine learning",
  "openai", "anthropic", "claude", "gpt", "gemini", "deepmind", "mistral", "llama",
